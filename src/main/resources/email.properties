# =====================================================================
#  CAU HINH GUI EMAIL OTP  ->  DIEN GMAIL CUA CHINH BAN VAO DAY
# =====================================================================
#
#  Ban dung Gmail NAO CUNG DUOC (khong phai mail do ai cap). Chi can:
#
#  BUOC 1: Bat xac minh 2 buoc (2-Step Verification) cho tai khoan Google
#          -> https://myaccount.google.com/security
#
#  BUOC 2: Tao "Mat khau ung dung" (App Password) 16 ky tu
#          -> https://myaccount.google.com/apppasswords
#          (Gmail KHONG cho dung mat khau dang nhap thuong de gui SMTP,
#           BAT BUOC phai dung App Password.)
#
#  BUOC 3: Dien 2 dong duoi day:
#          - mail.smtp.username = dia chi Gmail cua ban
#          - mail.smtp.password = App Password 16 ky tu (dan ca dau cach
#            cung duoc, he thong tu bo dau cach)
#
#  BUOC 4: Chay lai run.bat (build + deploy lai).
#
#  Neu de TRONG 2 dong do -> chay CHE DO DEV: OTP hien tren trang + in ra
#  log server, KHONG gui mail that (van test duoc day du chuc nang).
#
#  MEO: Muon doi Gmail ma KHONG build lai -> tao 1 file .properties ben
#  ngoai roi tro toi no bang bien moi truong MAIL_CONFIG (hoac
#  -Dmail.config=D:\duong-dan\email.properties). Gia tri ngoai se ghi de.
#
#  BAO MAT: repo la public. Neu ban dien App Password that vao file nay
#  thi DUNG commit/push len GitHub (co the dung MAIL_CONFIG de tach ra).
# =====================================================================

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587

# ==== DIEN CUA BAN VAO 2 DONG DUOI ====
mail.smtp.username=
mail.smtp.password=

# De trong = dung luon dia chi o username lam nguoi gui
mail.smtp.from=
