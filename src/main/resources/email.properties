# ============================================================
# Cau hinh gui email OTP (SMTP)
# ------------------------------------------------------------
# - De TRONG username/password  -> chay CHE DO DEV: OTP in ra
#   log server + hien tren trang, KHONG gui mail that.
# - Dien Gmail + App Password    -> gui mail that.
#
# Cach lay App Password Gmail: bat 2-Step Verification cho tai
# khoan Google, vao https://myaccount.google.com/apppasswords,
# tao mat khau ung dung 16 ky tu, dan vao mail.smtp.password.
#
# LUU Y BAO MAT: repo la public. KHONG commit mat khau that.
# Nen dat qua bien moi truong thay vi sua file nay:
#   MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
# (bien moi truong duoc uu tien hon gia tri trong file nay)
# ============================================================

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.username=
mail.smtp.password=
mail.smtp.from=
